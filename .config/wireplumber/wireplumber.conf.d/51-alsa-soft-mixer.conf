# Built-in Audio (Realtek ALC289 / HDA Intel PCH) has a hardware volume
# route that PipeWire reports as active (route.hw-volume/hw-mute = true)
# but which doesn't audibly change playback level. Force software volume
# instead so the level is actually applied to the digital signal, same as
# the Scarlett (which has no usable hardware mixer at all).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]

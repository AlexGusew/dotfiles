[character]
success_symbol = '[\$](bold green)'
error_symbol = '[x](bold red)'
vicmd_symbol = '[❮](bold yellow)'

[status]
disabled = false
symbol = "✖ "
style = "bold red"
format = '[\[$symbol$status\]]($style) '

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
staged = "+${count}"
modified = "!${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "*${count}"

